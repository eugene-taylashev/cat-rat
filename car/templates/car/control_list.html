{% extends "car/base.html" %}
{% block content %}
{% load static %}

<script>document.title = "{{ ptitle }}";</script>
    <div class="container">
      <h1 class="title">Your Controls</h1>

      <table class="table is-striped is-hoverable is-fullwidth">
        <thead>
          <tr>
            <th>Control</th>
            <th>Description
              <div style="display: inline-block; float: right;"><a href="{% url 'control_edit' 0 %}"><span title="Add new Control" class="button is-primary">Add Control +</span></a></div>
            </th>
			<th>Action</th>
          </tr>
        </thead>
        <tbody>
        {% for contrl in control_list %}
          <tr>
            <td>
               {{ contrl.control_label }}
            </td>
            <td>{{ contrl.description }}</td>
			<td>
				    <a href="{% url 'control_edit' contrl.pk %}"><span class="button is-small is-primary">Edit</span></a> | 
					<a href="{% url 'control_delete' contrl.pk %}"><span class="button is-small is-danger">Delete</span></a> 
			</td>
          </tr>
        {% empty %}
            <tr><td>No controls are assigned to you.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
{% endblock %}
